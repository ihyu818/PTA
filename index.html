<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班親會家長關心議題調查</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-lg w-full bg-white rounded-2xl shadow-lg p-6 md:p-8">
    
    <!-- 第 1 頁：基本資料 -->
    <div id="step1" class="space-y-6">
      <div class="border-b pb-4">
        <h2 class="text-2xl font-bold text-slate-800">歡迎參加班親會</h2>
        <p class="text-sm text-slate-500 mt-1">請先填寫基本資料以利親師交流登記。</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">學生座號 / 姓名</label>
          <input type="text" id="studentInfo" placeholder="例：05號 王小明" 
                 class="mt-1 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">家長稱謂 / 姓名</label>
          <input type="text" id="parentName" placeholder="例：小明媽媽 / 王大同" 
                 class="mt-1 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <button onclick="nextStep()" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition shadow-md">
        下一步：填寫關心議題
      </button>
    </div>

    <!-- 第 2 頁：關心議題與問題 -->
    <div id="step2" class="hidden space-y-6">
      <div class="border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800">請依序選出最關心的 3 個面向</h2>
        <p class="text-xs text-slate-500 mt-1">並歡迎留下您最想與導師或科任老師討論的具體問題。</p>
      </div>

      <form id="questionsForm" class="space-y-5">
        <!-- 順位 1 -->
        <div class="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl space-y-3">
          <label class="block font-semibold text-indigo-900">🥇 第一關心的面向：</label>
          <select id="choice1" required class="w-full p-2.5 bg-white border border-slate-300 rounded-lg topic-select">
            <option value="">-- 請選擇面向 --</option>
          </select>
          <input type="text" id="question1" placeholder="針對此面向，您目前最想問或了解的是？" 
                 class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm">
        </div>

        <!-- 順位 2 -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
          <label class="block font-semibold text-slate-800">🥈 第二關心的面向：</label>
          <select id="choice2" required class="w-full p-2.5 bg-white border border-slate-300 rounded-lg topic-select">
            <option value="">-- 請選擇面向 --</option>
          </select>
          <input type="text" id="question2" placeholder="針對此面向，您目前最想問或了解的是？" 
                 class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm">
        </div>

        <!-- 順位 3 -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
          <label class="block font-semibold text-slate-800">🥉 第三關心的面向：</label>
          <select id="choice3" required class="w-full p-2.5 bg-white border border-slate-300 rounded-lg topic-select">
            <option value="">-- 請選擇面向 --</option>
          </select>
          <input type="text" id="question3" placeholder="針對此面向，您目前最想問或了解的是？" 
                 class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm">
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="prevStep()" class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-lg font-medium">
            回上一步
          </button>
          <button type="submit" id="submitBtn" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition">
            確認送出
          </button>
        </div>
      </form>
    </div>

    <!-- 成功提示頁 -->
    <div id="stepSuccess" class="hidden text-center py-10 space-y-4">
      <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl">✓</div>
      <h3 class="text-2xl font-bold text-slate-800">填寫完成！</h3>
      <p class="text-slate-600 text-sm">感謝您的回饋，您的關心重點已即時匯入前方投影螢幕。</p>
    </div>

  </div>

  <script>
    const TOPICS = [
      "學習成效與課業表現",
      "生涯規劃與升學進路",
      "同儕關係與社交發展",
      "情緒調適與心理韌性",
      "數位產品與網路使用",
      "作息管理與生活常規",
      "家庭溝通與親子互動",
      "課外活動與社團參與"
    ];

    // 替換為您的 GAS Web App 部署網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNS9a0CumSnLw6qTjzczFBLyCx1NmbWL2Vt8q7qg-nRsfJdhBvKohMUF_BIDLRWVpxAw/exec";

    // 動態填充選單
    document.querySelectorAll(".topic-select").forEach(sel => {
      TOPICS.forEach(topic => {
        const opt = document.createElement("option");
        opt.value = topic;
        opt.textContent = topic;
        sel.appendChild(opt);
      });
    });

    function nextStep() {
      const student = document.getElementById("studentInfo").value.trim();
      const parent = document.getElementById("parentName").value.trim();
      if (!student || !parent) {
        alert("請先填寫基本資料！");
        return;
      }
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    function prevStep() {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.remove("hidden");
    }

    document.getElementById("questionsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "傳送中...";

      const payload = {
        studentInfo: document.getElementById("studentInfo").value.trim(),
        parentName: document.getElementById("parentName").value.trim(),
        choice1: document.getElementById("choice1").value,
        question1: document.getElementById("question1").value.trim(),
        choice2: document.getElementById("choice2").value,
        question2: document.getElementById("question2").value.trim(),
        choice3: document.getElementById("choice3").value,
        question3: document.getElementById("question3").value.trim()
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors", // 跨域送出 GAS 常用設定
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        document.getElementById("step2").classList.add("hidden");
        document.getElementById("stepSuccess").classList.remove("hidden");
      } catch (err) {
        alert("送出失敗，請再試一次或通知導師！");
        btn.disabled = false;
        btn.innerText = "確認送出";
      }
    });
  </script>
</body>
</html>
